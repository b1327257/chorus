<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆるコーラス">
<title>ゆるコーラス</title>
<style>
:root{
  --sky1:#2b3a67;--sky2:#e8a87c;--floor:#f3d9a4;--card:rgba(255,246,230,.58);
  --pill:#fff6e6;--pill-sub:#f7e8cd;--pill-ink:#3a2f4f;--pill-on:#ffd166;--Accent:#ff8a5b;--ink:#fff6e6;
  --shadow:rgba(40,30,70,.26);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#18203c;--sky2:#9e5f6d;--floor:#252136;--card:rgba(255,255,255,.08);
    --pill:#352f4b;--pill-sub:#2a253c;--pill-ink:#f5ead8;--pill-on:#eeb948;--Accent:#ff7b54;--ink:#fff1dc;
    --shadow:rgba(10,8,20,.45);
  }
}
:root[data-theme="dark"]{
  --sky1:#18203c;--sky2:#9e5f6d;--floor:#252136;--card:rgba(255,255,255,.08);
  --pill:#352f4b;--pill-sub:#2a253c;--pill-ink:#f5ead8;--pill-on:#eeb948;--Accent:#ff7b54;--ink:#fff1dc;
  --shadow:rgba(10,8,20,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","BIZ UDPGothic","Yu Gothic",sans-serif;
  color:var(--ink);overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2));
}
.app{height:100%;display:flex;flex-direction:column}
.in{width:100%;max-width:600px;margin:0 auto;padding:0 10px}
.sky{flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px}
.top-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.top-right{display:flex;align-items:center;gap:5px}
.info{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:4px}
.hint-box{display:flex;flex-direction:column;align-items:center;min-width:4.4em}
.hint{font-size:1.55rem;font-weight:700;letter-spacing:.02em;text-align:center;line-height:1.1}
.hint-sub{font-size:.68rem;opacity:.85;margin-top:3px;font-weight:700}
.score-wrap{position:relative;display:flex;align-items:center}
#score{height:68px;width:auto;flex:none;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stage{display:flex;align-items:flex-end;justify-content:center;padding-top:2px;position:relative;height:clamp(84px,14vh,122px)}
.floor{
  flex:1;min-height:0;overflow-y:auto;
  background:var(--floor);border-radius:20px 20px 0 0;
  color:var(--pill-ink);padding-bottom:18px;
  box-shadow:0 -4px 16px rgba(0,0,0,.15);
}
.floor .in{padding-top:8px;display:flex;flex-direction:column;gap:7px}
.sec{background:var(--card);border-radius:14px;padding:7px 8px;display:flex;flex-direction:column;gap:6px}
.pads{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.quals{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.split-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sub-group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.preset-box{border-top:1px dashed rgba(120,100,150,.28);padding-top:6px;display:flex;align-items:flex-start;gap:6px}
.preset-box .lab{padding-top:5px}
.lab{font-size:.72rem;font-weight:700;opacity:.75;min-width:2.2em}
.pad{
  font:700 .88rem/1 inherit;font-family:inherit;border:0;border-radius:999px;
  padding:8px 0;background:var(--pill);color:var(--pill-ink);
  cursor:pointer;box-shadow:0 2px 0 var(--shadow);
  transition:transform .06s,box-shadow .06s,background .12s,opacity .12s;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
.pads .pad{padding:8px 0;font-size:.9rem}
.pads .pad.acc{background:var(--pill-sub)}
.quals .pad{padding:6px 2px;font-size:.77rem;border-radius:10px}
.row .pad,.sub-group .pad,.top-left .pad,.top-right .pad{padding:6px 10px;font-size:.78rem}
.preset-list{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.preset-list .pad{background:var(--pill-sub);padding:5px 10px;font-size:.75rem;border-radius:9px}
.top-left .pad,.top-right .pad{padding:5px 9px;font-size:.74rem}
.pad:active,.pad.on{transform:translateY(2px);box-shadow:0 0 0 var(--shadow)}
.pad.sel,.pad.on{background:var(--pill-on);color:#2b213a}
.pad.hold-on{background:var(--Accent);color:#fff}
.pad.now{outline:2.5px solid var(--pill-ink);outline-offset:1px}
.pad.edit-sel{outline:2px dashed var(--Accent);outline-offset:1px}
.pad.rec{background:#ff5c5c;color:#fff;animation:pulse 1s infinite}
.pad.save-ready{background:#34a853;color:#fff}
.pad:disabled,.pad.dis{opacity:.35;pointer-events:none}
.pad:focus-visible{outline:3px solid var(--pill-ink);outline-offset:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
.plist-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:28px}
.pchip{display:inline-flex;align-items:center;border-radius:999px;background:var(--pill);box-shadow:0 2px 0 var(--shadow);overflow:hidden}
.pchip.now{outline:2.5px solid var(--pill-ink);outline-offset:1px}
.pchip.edit-sel{background:var(--pill-on);color:#2b213a}
.pchip .p-main{border:0;background:transparent;color:inherit;font:700 .78rem/1 inherit;padding:6px 7px 6px 9px;cursor:pointer;touch-action:manipulation}
.pchip .p-del{border:0;background:rgba(0,0,0,.08);color:inherit;font:700 .72rem/1 inherit;padding:6px 6px;cursor:pointer;opacity:.7}
.pchip .p-del:hover,.pchip .p-del:active{opacity:1;background:rgba(255,80,80,.25)}
.empty{font-size:.76rem;opacity:.72;padding:2px 4px}
.hid{display:none!important}

/* Zukan (Chord Encyclopedia) panel */
.zukan-card{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.zukan-top{display:flex;align-items:center;gap:14px;background:#fff6e6;color:#3a2f4f;border-radius:12px;padding:10px 14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.zukan-score-wrap{flex:none;display:flex;align-items:center;justify-content:center}
#zukanScore{height:86px;width:auto;display:block}
.zukan-head{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.zukan-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zukan-cname{font-size:1.4rem;font-weight:700;color:#2b213a;line-height:1.1}
.zukan-mood{display:inline-block;background:#ffd166;color:#2b213a;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;line-height:1.3}
.zukan-read{font-size:.78rem;font-weight:700;opacity:.78;color:#3a2f4f;line-height:1.3}
.zukan-tones{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tone-pill{background:rgba(58,47,79,.09);color:#2b213a;border-radius:7px;padding:3px 8px;font-size:.76rem;font-weight:700;line-height:1.2}
.tone-pill small{font-weight:500;opacity:.8;margin-left:3px}
.zukan-body{background:var(--pill);color:var(--pill-ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.82rem;line-height:1.65}
.zukan-desc{margin:0;font-weight:500}
.zukan-sub{display:flex;flex-direction:column;gap:7px;padding-top:9px;border-top:1px dashed rgba(120,100,150,.28);font-size:.78rem;line-height:1.55}
.zukan-sub-row{display:flex;gap:8px;align-items:baseline}
.zukan-tag{font-weight:700;background:var(--pill-sub);padding:2px 8px;border-radius:6px;flex:none;font-size:.72rem}

.char{flex:1 1 0;min-width:0;max-width:110px;position:relative;display:flex;flex-direction:column;align-items:center}
.char:nth-child(2){transform:translateY(-4%)}.char:nth-child(3){transform:translateY(2%)}
.char svg{width:100%;max-height:74px;height:auto;overflow:visible;display:block}
.body{transform-box:fill-box;transform-origin:50% 100%;animation:idle 4s ease-in-out infinite;animation-delay:var(--d)}
.sing .body{animation:hop .9s ease-in-out infinite}
@keyframes idle{0%,100%{transform:scale(1,1) rotate(-1.2deg)}50%{transform:scale(1.02,.975) rotate(1.2deg)}}
@keyframes hop{0%,100%{transform:scale(1.04,.94) rotate(-3deg)}50%{transform:translateY(-6px) scale(.97,1.05) rotate(3deg)}}
.mo{display:none}.sing .mo{display:inline}.sing .smile{display:none}
.open{display:inline}.shut{display:none}.sing .open{display:none}.sing .shut{display:inline}
.say{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--pill);color:var(--pill-ink);border-radius:14px;padding:2px 9px;font-weight:700;font-size:.86rem;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.sing .say{opacity:1}
.nn{font-weight:700;font-size:.82rem;color:#fff6e6;margin:1px 0 3px;opacity:.85;transition:opacity .2s;text-align:center;line-height:1.1;white-space:nowrap}
.nn small{display:block;font-size:.58rem;font-weight:500}
.sing .nn{opacity:1}
.note{position:absolute;pointer-events:none;font-size:1.3rem;color:var(--pill-on);animation:rise 2.2s ease-out forwards;text-shadow:0 1px 0 rgba(0,0,0,.2)}
@keyframes rise{from{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}to{opacity:0;transform:translate(var(--dx),-120px) rotate(var(--r))}}
/* Modal for full progression score */
.modal-bg{position:fixed;inset:0;background:rgba(15,12,28,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal{background:var(--floor);color:var(--pill-ink);border-radius:18px;padding:14px;width:100%;max-width:540px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.modal-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.95rem}
.modal-score{overflow-x:auto;background:#fff6e6;border-radius:12px;padding:8px;text-align:center}
.modal-score svg{height:126px;width:auto;display:block;margin:0 auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px}
@media (prefers-reduced-motion: reduce){.body{animation:none!important}.note{animation-duration:.01s}}
</style>
</head>
<body>
<div class="app">
  <div class="sky"><div class="in">
    <div class="topbar">
      <div class="top-left">
        <span class="row" id="srow" style="margin:0"></span>
      </div>
      <div class="top-right">
        <button type="button" class="pad" id="zukanBtn" aria-label="和音ずかんモード切替">📖 ずかん</button>
        <button type="button" class="pad" id="holdBtn" aria-label="ホールド切替">ホールド</button>
        <button type="button" class="pad" id="themeBtn" aria-label="テーマ切替">🌙</button>
      </div>
    </div>
    <div class="info" id="topInfo">
      <div class="hint-box">
        <div class="hint" id="hint"></div>
        <div class="hint-sub" id="hintSub"></div>
      </div>
      <div class="score-wrap" id="scoreWrap">
        <svg id="score" viewBox="0 -12 108 104" role="img" aria-label="構成音の楽譜"></svg>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </div></div>

  <div class="floor"><div class="in">
    <div class="sec">
      <div class="pads" id="pads"></div>
      <div class="quals" id="quals"></div>
      <div class="split-row">
        <div class="sub-group"><span class="lab">配置</span><span class="row" id="vrow" style="margin:0"></span></div>
        <div class="sub-group"><span class="lab">転回</span><span class="row" id="irow" style="margin:0"></span></div>
      </div>
    </div>

    <div class="zukan-card hid" id="zukanPanel">
      <div class="zukan-top">
        <div class="zukan-score-wrap">
          <svg id="zukanScore" viewBox="0 -12 108 104" role="img" aria-label="和音ずかんの楽譜"></svg>
        </div>
        <div class="zukan-head">
          <div class="zukan-title-row">
            <span class="zukan-cname" id="zName"></span>
            <span class="zukan-mood" id="zMood"></span>
          </div>
          <div class="zukan-read" id="zRead"></div>
          <div class="zukan-tones" id="zTones"></div>
        </div>
      </div>
      <div class="zukan-body">
        <p class="zukan-desc" id="zDesc"></p>
        <div class="zukan-sub">
          <div class="zukan-sub-row"><span class="zukan-tag">使われ方</span><span id="zRole"></span></div>
          <div class="zukan-sub-row"><span class="zukan-tag">いまの形</span><span id="zForm"></span></div>
        </div>
      </div>
    </div>

    <div class="sec" id="progSec">
      <div class="row" style="justify-content:space-between">
        <div class="sub-group" style="flex:1;min-width:0">
          <span class="lab">進行</span>
          <div class="plist-wrap" id="plist"></div>
        </div>
      </div>
      <div class="row" id="pctl"></div>
      <div class="preset-box">
        <span class="lab">定番</span>
        <div class="preset-list" id="prow"></div>
      </div>
    </div>

    <div class="sec" id="tempoSec">
      <div class="row"><span class="lab">速度</span><span class="row" id="trow" style="margin:0;flex:1"></span></div>
      <div class="split-row">
        <div class="row" id="tools" style="margin:0"></div>
        <div class="empty" id="recst"></div>
      </div>
    </div>
  </div></div>
</div>

<div class="modal-bg hid" id="scoreModal" role="dialog" aria-modal="true" aria-label="楽譜プレビュー">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle">進行の楽譜</span>
      <button type="button" class="pad" id="closeModalBtn" style="padding:5px 11px">閉じる</button>
    </div>
    <div class="modal-score" id="modalScoreBox"></div>
    <div class="modal-foot">
      <button type="button" class="pad sel" id="dlPngBtn" style="padding:8px 16px">画像(PNG)を保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY="yuru_chorus_state_v1";
  var ROOT_READ=["シー","シーシャープ","ディー","イーフラット","イー","エフ","エフシャープ","ジー","エーフラット","エー","ビーフラット","ビー"];
  var ROOTS=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"].map(function(n,i){return {n:n,pc:i,acc:n.length>1,read:ROOT_READ[i]}});
  var QUALS=[
    {l:"メジャー",s:"",iv:[0,4,7],v:"a",read:"メジャー",mood:"☀️ 明るくまっすぐ",
     desc:"根音・長3度・完全5度を重ねた、もっとも基本的で晴れやかな3和音です。迷いのない明るい響きで、音楽の土台になります。",
     role:"曲の始まりや終わり（トニック）など、安心感や明るさを出したい場面の主役です。"},
    {l:"マイナー",s:"m",iv:[0,3,7],v:"u",read:"マイナー",mood:"🌙 切なくしっとり",
     desc:"メジャーの真ん中の音（3度）を半音下げた3和音です。少し影のある落ち着いた響きで、悲しみや優しさ、真剣さを表現できます。",
     role:"バラードや哀愁のあるメロディ、物語が動く場面の要になります。"},
    {l:"7",s:"7",iv:[0,4,7,10],v:"o",read:"セブンス",mood:"🔥 次の音へ進みたい力",
     desc:"メジャーに短7度を加えた4和音です。長3度と短7度がぶつかる独特の緊張感（トライトーン）があり、次の安定した和音へ解決したくなる強い推進力を持ちます。",
     role:"サビ前などで盛り上げて主和音へ戻る「ドミナント」や、ブルース・ロックの渋い響きに定番です。"},
    {l:"maj7",s:"maj7",iv:[0,4,7,11],v:"e",read:"メジャー・セブンス",mood:"✨ おしゃれで都会的",
     desc:"メジャーに長7度を加えた4和音です。明るさの中に少し甘く切ない浮遊感が混ざり、大人っぽく洗練された空気を作ります。",
     role:"シティポップ、ジャズ、ボサノバ、穏やかなポップスでやさしい余韻を作りたいときに大活躍します。"},
    {l:"m7",s:"m7",iv:[0,3,7,10],v:"u",read:"マイナー・セブンス",mood:"☕ やわらかく穏やか",
     desc:"マイナーに短7度を加えた4和音です。普通のマイナーよりも角が取れてマイルドになり、暗すぎず心地よく溶け込む響きになります。",
     role:"J-POPやR&B、ジャズまでジャンルを問わず頻出する、繋ぎにも主役にもなれる万能コードです。"},
    {l:"6",s:"6",iv:[0,4,7,9],v:"a",read:"シックス",mood:"🍀 懐かしく朗らか",
     desc:"メジャーに長6度の音を添えた4和音です。maj7よりも素朴で人懐っこく、どこかレトロで温かいハッピーな響きがします。",
     role:"ジャズのエンディングや、昭和歌謡・ハワイアン・軽快なポップスの彩りにぴったりです。"},
    {l:"add9",s:"add9",iv:[0,4,7,14],v:"a",read:"アド・ナインス",mood:"💧 透明感と広がり",
     desc:"7度を入れずに、メジャーの1オクターブ上の9度（2度）を足した和音です。濁りのないキラキラした透明感と青春感のある広がりが生まれます。",
     role:"J-POPのイントロやサビの頭、アコースティックギターやピアノの爽やかな伴奏でよく使われます。"},
    {l:"sus4",s:"sus4",iv:[0,5,7],v:"e",read:"サス・フォー",mood:"🌬️ 宙に浮いた期待感",
     desc:"明るさ・暗さを決める3度の代わりに完全4度を置いた3和音です。メジャーでもマイナーでもない中性的な響きで、「これからどうなる？」という期待感を生みます。",
     role:"サビ直前のタメや、同じルート音のメジャーコード（C→Csus4→Cなど）への装飾によく使われます。"},
    {l:"dim",s:"dim",iv:[0,3,6],v:"i",read:"ディミニッシュ",mood:"⚡ 不安・スリリング",
     desc:"短3度ずつ音を積み重ねた、緊張感の高い3和音です。足場が揺らぐようなミステリアスでドラマチックな響きを持っています。",
     role:"サスペンス風の演出や、半音ずつ滑らかにコードを繋ぐパッシング（経過和音）として使われます。"},
    {l:"aug",s:"aug",iv:[0,4,8],v:"i",read:"オーギュメント",mood:"🌀 不思議・夢のよう",
     desc:"長3度ずつ音を重ね、5度を半音上げた3和音です。ふわっと視界が歪むような、幻想的で謎めいた独特の浮遊感があります。",
     role:"回想シーンのような不思議な場面転換や、クリシェ（1音ずつ変化する進行）の途中で効果的に響きます。"},
    {l:"m7♭5",s:"m7♭5",iv:[0,3,6,10],v:"i",read:"マイナー・セブン・フラットファイブ",mood:"🍂 切迫した切なさ",
     desc:"m7の5度を半音下げた4和音（別名ハーフ・ディミニッシュ）です。ただ暗いだけでなく、胸がキュッと締めつけられるようなドラマチックな陰影があります。",
     role:"マイナーキーのツーファイブ進行（II-V-I）の起点や、エモーショナルな転調のきっかけに欠かせません。"},
    {l:"9",s:"9",iv:[0,4,7,10,14],v:"o",read:"ナインス",mood:"🕺 ファンキーで華やか",
     desc:"セブンス（7）にさらに9度の音を加えた5和音です。セブンスの力強さに華やかな彩りとグルーヴ感が加わり、リッチなサウンドになります。",

    all.forEach(function(t){x=/^t(\d{2,3})$/.exec(t);if(x)bpm=Math.max(40,Math.min(200,+x[1]));x=/^k([124])$/.exec(t);if(x)beats=+x[1]});
    var ts=all.filter(function(t){return /^[0-9ab][0-9a-e][0-3][01]$/.test(t)});
    if(!ts.length)return;
    var cs=ts.map(parse).filter(function(c){return c.q<QUALS.length}).slice(0,16); if(!cs.length)return;
    if(m[1]==="p"){prog=cs;Object.assign(cur,cs[0])}else Object.assign(cur,cs[0]);
  }
  window.addEventListener("hashchange",function(){if(location.hash.slice(1)!==hashOf()){stopProg();loadHash();renderProg();mark()}});

  /* ---- theme, hold & zukan mode ---- */
  function applyTheme(){
    if(theme){document.documentElement.setAttribute("data-theme",theme)}
    else{document.documentElement.removeAttribute("data-theme")}
    var isDark=theme==="dark"||(!theme&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    themeBtn.textContent=isDark?"☀️":"🌙";
  }
  themeBtn.addEventListener("click",function(){
    var isDark=theme==="dark"||(!theme&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    theme=isDark?"light":"dark"; applyTheme(); saveState();
  });
  holdBtn.addEventListener("click",function(){
    holdMode=!holdMode;
    holdBtn.classList.toggle("hold-on",holdMode);
    if(holdMode){begin(cur,null)}else if(!playing){stopSing()}
  });
  function syncModeUI(){
    zukanBtn.classList.toggle("sel",zukanMode);
    zukanPanel.classList.toggle("hid",!zukanMode);
    topInfo.classList.toggle("hid",zukanMode);
    progSec.classList.toggle("hid",zukanMode);
    tempoSec.classList.toggle("hid",zukanMode);
  }
  zukanBtn.addEventListener("click",function(){
    stopProg();
    zukanMode=!zukanMode;
    syncModeUI();
    mark();
  });

  /* ---- UI helpers ---- */
  function onChordPicked(fn,b){
    stopProg(); fn();
    var mInv=maxInv(cur.q);
    if(cur.i>mInv)cur.i=mInv;
    if(!zukanMode&&editIdx>=0&&editIdx<prog.length){
      prog[editIdx]=Object.assign({},cur);
      renderProg();
    }
    mark();
    begin(cur,b);
  }
  function hold(b,fn){
    b.addEventListener("pointerdown",function(e){e.preventDefault();pid=e.pointerId;onChordPicked(fn,b)});
    b.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&!e.repeat){e.preventDefault();pid=null;onChordPicked(fn,b)}});
    b.addEventListener("keyup",function(e){if(e.key==="Enter"||e.key===" ")release()});
    b.addEventListener("contextmenu",function(e){e.preventDefault()});
  }
  function mk(parent,label,aria,fn){var b=document.createElement("button");b.className="pad";b.type="button";b.textContent=label;b.setAttribute("aria-label",aria);hold(b,fn);parent.appendChild(b);return b}
  function bt(parent,label,fn,aria){var b=document.createElement("button");b.className="pad";b.type="button";b.textContent=label;if(aria)b.setAttribute("aria-label",aria);b.addEventListener("click",fn);parent.appendChild(b);return b}
  function tg(g,k){[].forEach.call(g.children,function(b,i){b.classList.toggle("sel",i===k)})}

  var invBtns=[],recBtn,saveA,scorePngBtn,recst=document.getElementById("recst");

  function syncToolsState(){
    if(recBtn){
      if(rec&&rec.state==="recording"){
        recBtn.textContent="■ 録音停止";
        recBtn.classList.add("rec");
      }else{
        recBtn.textContent=prog.length?"● 進行を録音":"● 和音を録音";
        recBtn.classList.remove("rec");
      }
    }
    if(scorePngBtn){
      var hasProg=prog.length>0;
      scorePngBtn.disabled=!hasProg;
      scorePngBtn.classList.toggle("dis",!hasProg);
    }
  }

  function renderZukan(t,stSvg){
    var R=ROOTS[cur.r],Q=QUALS[cur.q],b=t[0];
    var slash=(b.iv!==0?"（オン "+LN[b.L]+accStr(b.acc)+"）":"");
    zName.textContent=nameOf(cur);
    zMood.textContent=Q.mood;
    zRead.textContent=R.read+"・"+Q.read+slash;
    zTones.innerHTML=t.map(function(x){
      return '<span class="tone-pill">'+LN[x.L]+accStr(x.acc)+'<small>'+DEG[x.iv]+(x.dup?"・上":"")+'</small></span>';
    }).join("");
    zDesc.textContent=Q.desc;
    zRole.textContent=Q.role;
    var invText=[
      "基本形（根音 "+LN[b.L]+accStr(b.acc)+" が一番下にある、安定した土台の形）",
      "第1転回形（"+DEG[b.iv]+"の "+LN[b.L]+accStr(b.acc)+" をベースにした、軽やかで滑らかな響き）",
      "第2転回形（"+DEG[b.iv]+"の "+LN[b.L]+accStr(b.acc)+" をベースにした、浮遊感のあるスッキリした響き）",
      "第3転回形（"+DEG[b.iv]+"の "+LN[b.L]+accStr(b.acc)+" をベースにした、次の和音へ滑らかに繋がる形）"
    ][cur.i];
    var voiText=cur.v===0
      ?"密集配置（構成音を近くに集めた、まとまりのある温かいハーモニー）"
      :"開離配置（内声をオクターブ広げた、風通しのよい広がりのあるハーモニー）";
    zForm.textContent=voiText+" ／ "+invText;
    zukanScore.innerHTML=stSvg;
  }

  function mark(){
    var mInv=maxInv(cur.q);
    if(cur.i>mInv)cur.i=mInv;
    if(typeof rg!=="undefined"&&rg)syncTempo();
    tg(pads,cur.r);tg(quals,cur.q);tg(vrow,cur.v);tg(irow,cur.i);tg(srow,setIdx);
    invBtns.forEach(function(b,idx){
      var dis=idx>mInv;
      b.disabled=dis; b.classList.toggle("dis",dis);
    });
    var t=voicing(cur),n=t.length;
    chars.forEach(function(c,i){
      c.el.classList.toggle("hid",i>=n);
      if(i<n)c.nn.innerHTML=LN[t[i].L]+accStr(t[i].acc)+"<small>"+DEG[t[i].iv]+(t[i].dup?"(上)":"")+"</small>";
    });
    hint.textContent=nameOf(cur);
    hintSub.textContent=editIdx>=0?(editIdx+1)+"番目を編集中":(cur.v?"開離":"密集")+"・"+["基本形","第1転回","第2転回","第3転回"][cur.i];
    var st=staff([t],null);
    sc.innerHTML=st.svg;
    renderZukan(t,st.svg);
    syncToolsState();
    saveState();
  }

  ROOTS.forEach(function(r,i){
    var b=mk(pads,r.n,r.n+" をえらぶ",function(){cur.r=i});
    if(r.acc)b.classList.add("acc");
  });
  QUALS.forEach(function(q,i){mk(quals,q.l,q.l+" をえらぶ",function(){cur.q=i})});
  ["密集","開離"].forEach(function(l,i){mk(vrow,l,l+"配置",function(){cur.v=i})});
  ["基本形","第1","第2","第3"].forEach(function(l,i){invBtns.push(mk(irow,l,l+"転回",function(){cur.i=i}))});
  SETS.forEach(function(s,i){bt(srow,s.n,function(){setIdx=i;buildStage();mark()})});

  /* ---- progression ---- */
  function hi(k){[].forEach.call(plist.children,function(el,i){el.classList.toggle("now",i===k)})}
  function renderProg(){
    plist.innerHTML="";
    if(editIdx>=prog.length)editIdx=-1;
    if(!prog.length){
      var e=document.createElement("span");e.className="empty";e.textContent="「＋追加」で和音を並べる（最大16個）";
      plist.appendChild(e); syncToolsState(); return;
    }
    prog.forEach(function(c,i){
      var wrap=document.createElement("div");
      wrap.className="pchip"+(i===editIdx?" edit-sel":"")+(i===pidx?" now":"");
      var main=document.createElement("button");
      main.type="button"; main.className="p-main";
      main.textContent=(i+1)+"."+nameOf(c);
      main.setAttribute("aria-label",(i+1)+"番目 "+nameOf(c)+" を選択");
      main.addEventListener("pointerdown",function(e){
        e.preventDefault(); pid=e.pointerId; stopProg();
        editIdx=(editIdx===i)?-1:i;
        Object.assign(cur,c); renderProg(); mark(); begin(cur,null);
      });
      var del=document.createElement("button");
      del.type="button"; del.className="p-del"; del.textContent="×";
      del.setAttribute("aria-label",(i+1)+"番目を削除");
      del.addEventListener("click",function(e){
        e.stopPropagation(); stopProg();
        prog.splice(i,1);
        if(editIdx===i)editIdx=-1; else if(editIdx>i)editIdx--;
        renderProg(); mark();
      });
      wrap.appendChild(main); wrap.appendChild(del);
      plist.appendChild(wrap);
    });
    syncToolsState();
  }
  function playProg(){
    if(!prog.length)return; init(); stopSing(); editIdx=-1; renderProg(); playing=true; pidx=0; playBtn.textContent="■ 止める"; step();
  }
  function step(){
    if(!playing)return;
    var recing=rec&&rec.state==="recording";
    if(pidx>=prog.length){
      if(loop&&!recing)pidx=0;
      else{stopProg();if(recing)setTimeout(function(){if(rec&&rec.state==="recording")rec.stop()},450);return}
    }
    Object.assign(cur,prog[pidx]); mark(); hi(pidx); clicks(); begin(cur,null);
    progT=setTimeout(function(){pidx++;step()},chordMs());
  }
  function stopProg(){
    if(!playing)return; playing=false; clearTimeout(progT); pidx=-1; hi(-1); if(!holdMode)stopSing(); playBtn.textContent="▶ 再生";
  }
  var playBtn=bt(pctl,"▶ 再生",function(){playing?stopProg():playProg()});
  bt(pctl,"＋追加",function(){
    if(prog.length<16){editIdx=-1;prog.push(Object.assign({},cur));renderProg();mark()}
  });
  bt(pctl,"全消去",function(){stopProg();editIdx=-1;prog=[];renderProg();mark()});
  var lp=bt(pctl,"くり返し",function(){loop=!loop;lp.classList.toggle("sel",loop);saveState()});
  PRESETS.forEach(function(p){bt(prow,p[0],function(){
    stopProg(); editIdx=-1; var key=ROOTS[cur.r].pc;
    prog=p[1].map(function(x){return {r:(key+x[0])%12,q:x[1],i:Math.min(cur.i,maxInv(x[1])),v:cur.v}});
    renderProg(); mark(); playProg();
  })});

  /* ---- tempo ---- */
  var trow=document.getElementById("trow"),bl=document.createElement("span"),rg=document.createElement("input"),bchips=[],taps=[],clickOn=false;
  bl.style.cssText="font-weight:700;font-size:.8rem;min-width:4.2em"; trow.appendChild(bl);
  rg.type="range"; rg.min=40; rg.max=200; rg.setAttribute("aria-label","テンポ(BPM)"); rg.style.cssText="flex:1;min-width:90px;accent-color:var(--pill-ink)";
  rg.addEventListener("input",function(){setBpm(+rg.value)}); trow.appendChild(rg);
  function setBpm(v){bpm=Math.max(40,Math.min(200,Math.round(v)));syncTempo();saveState()}
  function syncTempo(){
    bl.textContent="♩="+bpm;rg.value=bpm;
    bchips.forEach(function(b,i){b.classList.toggle("sel",[1,2,4][i]===beats)});
    lp.classList.toggle("sel",loop);
    ck.classList.toggle("sel",clickOn);
  }
  bt(trow,"TAP",function(){
    var n=performance.now(); if(taps.length&&n-taps[taps.length-1]>2000)taps=[]; taps.push(n); taps=taps.slice(-5);
    if(taps.length>1)setBpm(60000*(taps.length-1)/(taps[taps.length-1]-taps[0]));
  },"タップでテンポを決める");
  [1,2,4].forEach(function(k){bchips.push(bt(trow,k+"拍",function(){beats=k;syncTempo();saveState()},"1和音あたり"+k+"拍"))});
  var ck=bt(trow,"クリック",function(){clickOn=!clickOn;ck.classList.toggle("sel",clickOn);saveState()});
  function chordMs(){return beats*60000/bpm}
  function clicks(){
    if(!clickOn||!ctx)return; var s=60/bpm,t0=ctx.currentTime+.02,k,o,g;
    for(k=0;k<beats;k++){o=ctx.createOscillator();g=ctx.createGain();o.frequency.value=k?1000:1500;
      g.gain.setValueAtTime(.0001,t0+k*s);g.gain.exponentialRampToValueAtTime(.25,t0+k*s+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+k*s+.06);
      o.connect(g);g.connect(ctx.destination);o.start(t0+k*s);o.stop(t0+k*s+.08)}
  }

  /* ---- hybrid file save (iOS file:// share sheet + Web download) ---- */
  function saveBlob(blob,filename){
    if(window.claude&&claude.use){
      claude.use("downloads").then(function(d){d.save({filename:filename,data:blob}).catch(function(){fallbackSave(blob,filename)})},function(){fallbackSave(blob,filename)});
      return;
    }
    fallbackSave(blob,filename);
  }
  function fallbackSave(blob,filename){
    try{
      if(location.protocol==="file:"&&navigator.canShare){
        var file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:filename}).catch(function(){});
          return;
        }
      }
    }catch(e){}
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
  }

  /* ---- progression score preview modal & PNG export (progression only) ---- */
  function openScoreModal(){
    if(!prog.length)return;
    var o=staff(prog.map(voicing),prog.map(nameOf));
    modalTitle.textContent="進行の楽譜（"+prog.length+"和音）";
    modalScoreBox.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -26 '+o.w+' 118">'+o.svg+'</svg>';
    scoreModal.classList.remove("hid");
  }
  function exportScorePng(){
    if(!prog.length)return;
    var o=staff(prog.map(voicing),prog.map(nameOf));
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -26 '+o.w+' 118" width="'+o.w*3+'" height="354" font-family="sans-serif">'+o.svg+'</svg>';
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement("canvas"); cv.width=o.w*3; cv.height=354;
      cv.getContext("2d").drawImage(img,0,0);
      cv.toBlob(function(b){if(b)saveBlob(b,"yuru-score.png")},"image/png");
    };
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  }
  closeModalBtn.addEventListener("click",function(){scoreModal.classList.add("hid")});
  scoreModal.addEventListener("click",function(e){if(e.target===scoreModal)scoreModal.classList.add("hid")});
  dlPngBtn.addEventListener("click",exportScorePng);

  /* ---- export tools ---- */
  function initTools(){
    if(window.MediaRecorder){
      recBtn=bt(tools,"● 和音を録音",function(){
        init(); if(!dest)return;
        if(rec&&rec.state==="recording"){
          stopProg(); stopSing();
          setTimeout(function(){if(rec&&rec.state==="recording")rec.stop()},400);
          return;
        }
        stopProg();
        var M=["audio/webm;codecs=opus","audio/webm","audio/mp4"];
        recMime=M.filter(function(m){return MediaRecorder.isTypeSupported(m)})[0]||"";
        chunks=[];
        rec=recMime?new MediaRecorder(dest.stream,{mimeType:recMime}):new MediaRecorder(dest.stream);
        rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
        rec.onstop=function(){
          recBlob=new Blob(chunks,{type:rec.mimeType||recMime});
          syncToolsState();
          saveA.classList.remove("hid");
          saveA.classList.add("save-ready");
          recst.textContent="録音完了";
        };
        rec.start();
        syncToolsState();
        saveA.classList.add("hid");
        recst.textContent="録音中…";
        if(prog.length)playProg();
        else{
          begin(cur,null); clicks();
          progT=setTimeout(function(){stopSing();setTimeout(function(){if(rec&&rec.state==="recording")rec.stop()},450)},chordMs());
        }
      });
      saveA=bt(tools,"⬇ 音声を保存",function(){
        if(!recBlob)return;
        var ext=(recBlob.type||"").indexOf("mp4")>=0?"mp4":"webm";
        saveBlob(recBlob,"yuru-chorus."+ext);
      });
      saveA.classList.add("hid");
    }
    scorePngBtn=bt(tools,"🎼 進行の楽譜(PNG)",openScoreModal);
  }

  loadStored();
  loadHash();
  applyTheme();
  syncModeUI();
  buildStage();
  initTools();
  renderProg();
  mark();
})();
</script>
</body>
</html>
